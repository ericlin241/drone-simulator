<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>無人機遙控器</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://ericlin241.github.io/drone-simulator/controller.html">
  <meta name="description" content="Web 無人機模擬器手機遙控器，支援美國手、日本手、靈敏度調節與內八解鎖。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="Web 無人機模擬器｜手機遙控器">
  <meta property="og:description" content="雙搖桿即時操控，支援美國手、日本手、內八解鎖與靈敏度調節。">
  <meta property="og:image" content="https://ericlin241.github.io/drone-simulator/og-cover.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Web 無人機模擬器｜手機遙控器">
  <meta name="twitter:description" content="雙搖桿即時操控，支援美國手、日本手、內八解鎖與靈敏度調節。">
  <meta name="twitter:image" content="https://ericlin241.github.io/drone-simulator/og-cover.png">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Noto Sans TC", system-ui, sans-serif;
      background: #040a12;
      color: #f0f7ff;
      touch-action: none;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
    }

    #controller {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 50%, rgba(31, 131, 174, .22), transparent 34%),
        radial-gradient(circle at 80% 50%, rgba(52, 203, 151, .16), transparent 34%),
        linear-gradient(145deg, #0b1725, #050a11);
      user-select: none;
      -webkit-user-select: none;
    }

    .topbar {
      position: relative;
      z-index: 6;
      min-height: 52px;
      flex: 0 0 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: max(6px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 6px max(18px, env(safe-area-inset-left));
      border-bottom: 1px solid rgba(255,255,255,.09);
      background: rgba(3, 9, 16, .5);
    }

    h1 { margin: 0; font-size: .95rem; letter-spacing: .12em; }

    .brand small { display: block; margin-top: 2px; color: #6098b6; font-size: .55rem; letter-spacing: .12em; }

    .mode-switch {
      grid-column: 1 / -1;
      display: flex;
      width: 100%;
      padding: 3px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 11px;
      background: rgba(0,0,0,.22);
      touch-action: manipulation;
    }

    .mode-switch button {
      flex: 1;
      padding: 6px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #7f94a7;
      font-family: inherit;
      font-size: .68rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      touch-action: manipulation;
    }
    .mode-switch button.active { background: linear-gradient(135deg, #2aa6d5, #2286ae); color: white; box-shadow: 0 4px 16px rgba(42,166,213,.3); }

    #status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #a9bbcd;
      font-size: .76rem;
    }

    #status::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffba49;
      box-shadow: 0 0 12px currentColor;
    }

    #status.connected::before { background: #45e2a2; }
    #status.error::before { background: #ff6077; }

    .sticks {
      min-height: 0;
      flex: 1;
      display: flex;
      align-items: stretch;
      justify-content: space-evenly;
      gap: 2.2vw;
      padding: 7px max(20px, env(safe-area-inset-right)) max(9px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }

    .stick-panel {
      position: relative;
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 24px;
      background: rgba(255, 255, 255, .025);
    }

    .center-controls {
      flex: 0 0 clamp(82px, 13vw, 126px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-content: center;
      gap: 7px;
    }

    .command-button {
      min-height: 37px;
      padding: 6px 4px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 11px;
      background: linear-gradient(145deg, rgba(26,49,67,.95), rgba(13,28,42,.95));
      color: #dcecf7;
      font-family: inherit;
      font-size: clamp(.54rem, 1.4vw, .68rem);
      font-weight: 700;
      letter-spacing: .03em;
    }
    .command-button:active { transform: scale(.96); background: #234b64; }
    .command-button.wide { grid-column: 1 / -1; }
    .command-button.danger { border-color: rgba(255,82,111,.38); background: rgba(113,25,43,.6); color: #ffb3c0; }

    .sensitivity-control {
      grid-column: 1 / -1;
      padding: 7px 8px 6px;
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 11px;
      background: rgba(5, 17, 28, .76);
      color: #93aabd;
      font-size: clamp(.5rem, 1.25vw, .62rem);
      text-align: center;
    }
    .sensitivity-control output { color: #75ddff; font-family: ui-monospace, monospace; }
    .sensitivity-control input { width: 100%; height: 16px; margin: 3px 0 0; accent-color: #47c8f3; touch-action: manipulation; }

    .gesture-hint {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 7px;
      margin: 0;
      color: rgba(177,205,222,.65);
      font-size: .52rem;
      letter-spacing: .03em;
      transform: translateX(-50%);
      pointer-events: none;
      white-space: nowrap;
    }

    .feedback-toast {
      position: absolute;
      z-index: 20;
      top: 50%;
      left: 50%;
      min-width: 210px;
      padding: 14px 20px;
      border: 1px solid rgba(255,91,111,.5);
      border-radius: 16px;
      background: rgba(79,10,23,.92);
      box-shadow: 0 12px 44px rgba(0,0,0,.5);
      color: #fff;
      font-weight: 800;
      text-align: center;
      opacity: 0;
      transform: translate(-50%, -44%) scale(.92);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }
    .feedback-toast.visible { opacity: 1; transform: translate(-50%, -50%) scale(1); }

    .tuning-drawer {
      position: absolute;
      z-index: 15;
      top: 56px;
      right: max(18px, env(safe-area-inset-right));
      width: min(310px, 43vw);
      max-height: calc(100% - 74px);
      overflow: auto;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 15px;
      background: rgba(4,14,24,.94);
      box-shadow: 0 18px 55px rgba(0,0,0,.45);
    }
    .tuning-drawer summary { color: #dff7ff; font-size: .7rem; font-weight: 800; cursor: pointer; }
    .tuning-presets, .tuning-modes { display: flex; gap: 5px; margin: 8px 0; }
    .tuning-drawer button { flex: 1; padding: 6px; border: 1px solid rgba(91,210,250,.2); border-radius: 8px; background: rgba(42,143,181,.1); color: #cceeff; font: 700 .58rem inherit; }
    .tuning-drawer button.active { border-color: #66ddff; background: rgba(42,166,213,.36); }
    .tuning-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; }
    .tuning-grid label { color: #8fa8bc; font-size: .55rem; }
    .tuning-grid output { float: right; color: #70dfff; font-family: ui-monospace, monospace; }
    .tuning-grid input { width: 100%; height: 16px; accent-color: #47c8f3; touch-action: manipulation; }
    .haptic-toggle { display: flex; align-items: center; gap: 7px; margin-top: 8px; color: #a9bdcc; font-size: .58rem; }
    .haptic-toggle input { accent-color: #4ddca6; }

    .telemetry-strip {
      position: absolute;
      z-index: 3;
      top: 64px;
      left: 50%;
      display: flex;
      gap: 18px;
      padding: 5px 13px;
      border-radius: 999px;
      background: rgba(2,9,15,.56);
      color: #7893a8;
      font-size: .58rem;
      transform: translateX(-50%);
      pointer-events: none;
    }
    .telemetry-strip strong { margin-left: 4px; color: #cfefff; font-family: ui-monospace, monospace; }

    .stick-zone {
      position: absolute;
      inset: 34px;
    }

    .axis-label {
      position: absolute;
      z-index: 1;
      color: rgba(217, 233, 246, .48);
      font-size: clamp(.6rem, 1.8vw, .78rem);
      letter-spacing: .08em;
      pointer-events: none;
    }

    .axis-label.top { top: 12px; left: 50%; transform: translateX(-50%); }
    .axis-label.bottom { bottom: 12px; left: 50%; transform: translateX(-50%); }
    .axis-label.left { left: 12px; top: 50%; transform: translateY(-50%); }
    .axis-label.right { right: 12px; top: 50%; transform: translateY(-50%); }

    .values {
      position: absolute;
      z-index: 2;
      bottom: 9px;
      left: 50%;
      transform: translateX(-50%);
      color: #7fdfff;
      font: .68rem ui-monospace, monospace;
      white-space: nowrap;
      pointer-events: none;
    }

    .missing-peer {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: none;
      place-items: center;
      padding: 28px;
      text-align: center;
      background: #07111f;
      line-height: 1.7;
    }

    .missing-peer.visible { display: grid; }

    /* 直向握持時，把整個控制器畫布順時針轉 90 度並交換寬高。 */
    @media (orientation: portrait) {
      #controller {
        width: 100vh;
        height: 100vw;
        inset: 0 auto auto 0;
        transform-origin: top left;
        transform: rotate(90deg) translateY(-100%);
      }

      /* nipplejs 以螢幕座標計算位移；抵銷外層旋轉，讓搖桿圓點跟著手指。 */
      .stick-zone .nipple {
        transform: rotate(-90deg) !important;
        transform-origin: center !important;
      }
    }

    @media (max-height: 420px) {
      .topbar { height: 44px; flex-basis: 44px; }
      .sticks { padding-top: 6px; padding-bottom: 7px; }
      .stick-panel { border-radius: 20px; }
      .stick-zone { inset: 22px; }
      .telemetry-strip { top: 48px; }
      .command-button { min-height: 34px; }
      .sensitivity-control { padding-block: 4px; }
      .gesture-hint { bottom: 3px; }
    }
  </style>
</head>
<body>
  <main id="controller">
    <header class="topbar">
      <div class="brand"><h1>DRONE CONTROL</h1><small>WEB FLIGHT LAB</small></div>
      <div id="status">準備連線</div>
    </header>

    <div class="telemetry-strip">
      <span>高度<strong id="altitude">--</strong></span>
      <span>速度<strong id="speed">--</strong></span>
      <span>航向<strong id="heading">--</strong></span>
      <span>電量<strong id="battery">--</strong></span>
    </div>

    <section class="sticks">
      <div class="stick-panel">
        <span id="left-top" class="axis-label top">上升</span>
        <span id="left-bottom" class="axis-label bottom">下降</span>
        <span class="axis-label left">左旋</span>
        <span class="axis-label right">右旋</span>
        <div id="left-stick" class="stick-zone"></div>
        <output id="left-values" class="values">T 0.00 · Y 0.00</output>
      </div>

      <nav class="center-controls" aria-label="飛行功能">
        <div class="mode-switch" role="group" aria-label="搖桿模式">
          <button id="mode-us" class="active" type="button" aria-pressed="true">美國手</button>
          <button id="mode-jp" type="button" aria-pressed="false">日本手</button>
        </div>
        <button id="arm-button" class="command-button wide" type="button">解鎖馬達</button>
        <button class="command-button" type="button" data-command="takeoff">自動起飛</button>
        <button class="command-button" type="button" data-command="land">自動降落</button>
        <button class="command-button" type="button" data-command="reset">重設位置</button>
        <button class="command-button danger" type="button" data-command="emergency">緊急停止</button>
        <div class="sensitivity-control">調校面板可設定 Rate／速度／Expo／死區</div>
      </nav>

      <div class="stick-panel">
        <span id="right-top" class="axis-label top">前進</span>
        <span id="right-bottom" class="axis-label bottom">後退</span>
        <span class="axis-label left">左移</span>
        <span class="axis-label right">右移</span>
        <div id="right-stick" class="stick-zone"></div>
        <output id="right-values" class="values">P 0.00 · R 0.00</output>
      </div>
    </section>

    <p id="gesture-hint" class="gesture-hint">雙桿往內下壓並保持 0.8 秒可解鎖</p>
    <div id="feedback-toast" class="feedback-toast" role="alert"></div>

    <details id="rate-panel" class="tuning-drawer">
      <summary>⚙ 遙控器調校與震動回饋</summary>
      <div class="tuning-presets"><button type="button" data-preset="beginner">新手</button><button type="button" data-preset="standard">標準</button><button type="button" data-preset="racing">競速</button></div>
      <div class="tuning-modes"><button type="button" data-stick-mode="mode2">美國手 Mode 2</button><button type="button" data-stick-mode="mode1">日本手 Mode 1</button></div>
      <div class="tuning-grid">
        <label>最大速度 <output data-output="maxSpeedScale"></output><input data-config="maxSpeedScale" type="range" min="0.1" max="1" step="0.05"></label>
        <label>油門上限 <output data-output="throttleCap"></output><input data-config="throttleCap" type="range" min="0.1" max="1" step="0.05"></label>
        <label>RC Rate <output data-output="rcRate"></output><input data-config="rcRate" type="range" min="0.1" max="2" step="0.05"></label>
        <label>Expo <output data-output="expo"></output><input data-config="expo" type="range" min="0" max="1" step="0.05"></label>
        <label>Deadband <output data-output="deadband"></output><input data-config="deadband" type="range" min="0" max="0.2" step="0.01"></label>
      </div>
      <label class="haptic-toggle"><input id="haptic-enabled" type="checkbox" checked> 啟用分級震動（高輸出、航點、扣分、墜機）</label>
    </details>

    <div id="missing-peer" class="missing-peer">
      <p>網址中缺少 Peer ID。<br>請回到電腦端首頁，重新掃描 QR Code 開啟遙控器。</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
  <script type="module">
    import { RateConfig, bindRatePanel } from './js/rate-config.js';
    (() => {
      'use strict';

      const peerId = new URLSearchParams(location.search).get('peer');
      const statusElement = document.querySelector('#status');
      const controlState = { throttle: 0.5, yaw: 0, pitch: 0, roll: 0 };
      const modeButtons = {
        us: document.querySelector('#mode-us'),
        jp: document.querySelector('#mode-jp')
      };
      const rateConfig = new RateConfig();
      const physicalSticks = {
        left: { x: 0, y: 0 },
        right: { x: 0, y: 0 }
      };
      const gestureSticks = {
        left: { x: 0, y: 0, active: false },
        right: { x: 0, y: 0, active: false }
      };
      const gestureTouches = new Map();
      let stickMode = rateConfig.values.stickMode === 'mode1' ? 'jp' : 'us';
      let remoteArmed = false;
      let gestureStartedAt = 0;
      let gestureCooldownUntil = 0;
      let rawGestureTimer = 0;
      let lastCrashEvent = 0;
      let lastWaypoint = 1;
      let lastScoreBand = 100;
      let highOutputLatched = false;
      let connection = null;
      let lastSent = '';
      const hapticEnabled = document.querySelector('#haptic-enabled');
      hapticEnabled.checked = localStorage.getItem('drone-haptics') !== 'off';
      hapticEnabled.addEventListener('change', () => localStorage.setItem('drone-haptics', hapticEnabled.checked ? 'on' : 'off'));

      const HAPTICS = Object.freeze({
        arm: [45, 35, 75], disarm: 45, command: 30, waypoint: [25, 35, 25],
        penalty: [55, 45, 55], complete: [45, 35, 45, 35, 120], crash: [180, 80, 180, 80, 260], high: 18
      });
      function vibrate(pattern) {
        if (hapticEnabled.checked && navigator.vibrate) navigator.vibrate(pattern);
      }

      function setStatus(message, type = '') {
        statusElement.textContent = message;
        statusElement.className = type;
      }

      function clamp(value) {
        return Math.max(-1, Math.min(1, Number(value) || 0));
      }

      function shapePair(x, y) {
        let shapedX = clamp(x);
        let shapedY = clamp(y);
        // 初學者軸向輔助：主方向推得明確時，濾除小幅度的斜推誤差。
        if (Math.abs(y) > .28 && Math.abs(x) < .22) shapedX = 0;
        if (Math.abs(x) > .28 && Math.abs(y) < .22) shapedY = 0;
        return { x: shapedX, y: shapedY };
      }

      function sendControls(force = false) {
        if (!connection?.open) return;
        const payload = JSON.stringify(controlState);
        if (force || payload !== lastSent) {
          connection.send({ type: 'controls', values: { ...controlState }, stickMode });
          lastSent = payload;
        }
        const highOutput = Math.max(Math.abs(controlState.yaw), Math.abs(controlState.pitch), Math.abs(controlState.roll), Math.abs(controlState.throttle - .5) * 2) > .88;
        if (highOutput && !highOutputLatched) vibrate(HAPTICS.high);
        highOutputLatched = highOutput;
      }

      function sendCommand(command) {
        if (!connection?.open) return;
        connection.send({ type: 'command', command });
        vibrate(command === 'emergency' ? HAPTICS.crash : command === 'arm' ? (remoteArmed ? HAPTICS.disarm : HAPTICS.arm) : HAPTICS.command);
      }

      function showFeedback(message) {
        const toast = document.querySelector('#feedback-toast');
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(showFeedback.timer);
        showFeedback.timer = setTimeout(() => toast.classList.remove('visible'), 2600);
      }

      function updateArmGesture() {
        const now = performance.now();
        const armButton = document.querySelector('#arm-button');
        if (rawGestureTimer) {
          const progress = Math.min(1, (now - gestureStartedAt) / 800);
          armButton.textContent = `內八解鎖 ${Math.round(progress * 100)}%`;
        } else {
          armButton.textContent = remoteArmed ? '鎖定馬達' : '解鎖馬達';
        }
      }

      // 內八另外追蹤兩根手指的原始位移，避免 nipplejs 在部分手機的多點觸控中
      // 提早送出 end，造成保持進度意外歸零。這只負責解鎖判斷，不改動飛行軸值。
      document.addEventListener('touchstart', event => {
        for (const touch of event.changedTouches) {
          const target = touch.target instanceof Element ? touch.target.closest('.stick-zone') : null;
          let side = target?.id === 'left-stick' ? 'left' : target?.id === 'right-stick' ? 'right' : null;
          // 部分瀏覽器會把同一批多點觸控的 target 都設成第一根手指所在元素；
          // 此時改以兩個搖桿在畫面上的實際中心判斷每根手指屬於哪一側。
          if (!side || event.touches.length > 1) {
            const leftRect = document.querySelector('#left-stick').getBoundingClientRect();
            const rightRect = document.querySelector('#right-stick').getBoundingClientRect();
            const distanceTo = rect => Math.hypot(touch.clientX - (rect.left + rect.width / 2), touch.clientY - (rect.top + rect.height / 2));
            const leftDistance = distanceTo(leftRect);
            const rightDistance = distanceTo(rightRect);
            const nearestRect = leftDistance <= rightDistance ? leftRect : rightRect;
            if (Math.min(leftDistance, rightDistance) <= Math.max(nearestRect.width, nearestRect.height) * .72) {
              side = leftDistance <= rightDistance ? 'left' : 'right';
            }
          }
          if (!side) continue;
          gestureTouches.set(touch.identifier, { side, startX: touch.clientX, startY: touch.clientY });
          gestureSticks[side] = { x: 0, y: 0, active: true };
        }
      }, { passive: true });

      document.addEventListener('touchmove', event => {
        const portrait = matchMedia('(orientation: portrait)').matches;
        const leftRect = document.querySelector('#left-stick').getBoundingClientRect();
        const rightRect = document.querySelector('#right-stick').getBoundingClientRect();
        const centers = {
          left: { x: leftRect.left + leftRect.width / 2, y: leftRect.top + leftRect.height / 2 },
          right: { x: rightRect.left + rightRect.width / 2, y: rightRect.top + rightRect.height / 2 }
        };
        gestureSticks.left = { x: 0, y: 0, active: false };
        gestureSticks.right = { x: 0, y: 0, active: false };
        for (const touch of event.touches) {
          const leftDistance = Math.hypot(touch.clientX - centers.left.x, touch.clientY - centers.left.y);
          const rightDistance = Math.hypot(touch.clientX - centers.right.x, touch.clientY - centers.right.y);
          const side = leftDistance <= rightDistance ? 'left' : 'right';
          const dx = touch.clientX - centers[side].x;
          const dy = touch.clientY - centers[side].y;
          gestureSticks[side] = portrait
            ? { x: clamp(dy / 48), y: clamp(dx / 48), active: true }
            : { x: clamp(dx / 48), y: clamp(-dy / 48), active: true };
        }
        const inwardDown = gestureSticks.left.active && gestureSticks.right.active
          && gestureSticks.left.x > .42 && gestureSticks.left.y < -.42
          && gestureSticks.right.x < -.42 && gestureSticks.right.y < -.42;
        if (!remoteArmed && inwardDown && !rawGestureTimer && performance.now() > gestureCooldownUntil) {
          gestureStartedAt = performance.now();
          rawGestureTimer = window.setTimeout(() => {
            rawGestureTimer = 0;
            if (!gestureSticks.left.active || !gestureSticks.right.active) return;
            sendCommand('arm');
            showFeedback('馬達已解鎖');
            gestureStartedAt = 0;
            gestureCooldownUntil = performance.now() + 1500;
          }, 800);
        }
        updateArmGesture();
      }, { passive: true });

      function endGestureTouches(event) {
        let endedArmTouch = false;
        for (const touch of event.changedTouches) {
          const tracked = gestureTouches.get(touch.identifier);
          if (!tracked) continue;
          gestureTouches.delete(touch.identifier);
          gestureSticks[tracked.side] = { x: 0, y: 0, active: false };
          endedArmTouch = true;
        }
        if ((endedArmTouch || event.touches.length < 2) && rawGestureTimer) {
          clearTimeout(rawGestureTimer);
          rawGestureTimer = 0;
          gestureStartedAt = 0;
        }
        updateArmGesture();
      }
      document.addEventListener('touchend', endGestureTouches, { passive: true });
      document.addEventListener('touchcancel', endGestureTouches, { passive: true });

      function setStickMode(mode) {
        stickMode = mode;
        localStorage.setItem('drone-stick-mode', mode);
        const configMode = mode === 'jp' ? 'mode1' : 'mode2';
        if (rateConfig.values.stickMode !== configMode) rateConfig.set({ stickMode: configMode });
        modeButtons.us.classList.toggle('active', mode === 'us');
        modeButtons.jp.classList.toggle('active', mode === 'jp');
        modeButtons.us.setAttribute('aria-pressed', String(mode === 'us'));
        modeButtons.jp.setAttribute('aria-pressed', String(mode === 'jp'));
        const japanese = mode === 'jp';
        document.querySelector('#left-top').textContent = japanese ? '前進' : '上升';
        document.querySelector('#left-bottom').textContent = japanese ? '後退' : '下降';
        document.querySelector('#right-top').textContent = japanese ? '上升' : '前進';
        document.querySelector('#right-bottom').textContent = japanese ? '下降' : '後退';
        Object.assign(controlState, { throttle: .5, yaw: 0, pitch: 0, roll: 0 });
        document.querySelector('#left-values').value = japanese ? 'P 0.00 · Y 0.00' : 'T 0.00 · Y 0.00';
        document.querySelector('#right-values').value = japanese ? 'T 0.00 · R 0.00' : 'P 0.00 · R 0.00';
        sendControls(true);
      }

      function makeStick(zone, onMove, onEnd) {
        const manager = nipplejs.create({
          zone,
          mode: 'static',
          position: { left: '50%', top: '50%' },
          size: Math.min(138, Math.max(86, Math.min(zone.clientWidth, zone.clientHeight) * .66)),
          color: '#75ddff',
          restJoystick: true
        });
        manager.on('move', (_event, data) => {
          if (!data?.vector) return;
          const rawX = clamp(data.vector.x);
          const rawY = clamp(data.vector.y);
          if (matchMedia('(orientation: portrait)').matches) {
            // 外層順時針 90°：螢幕右方等於控制器的上方。
            onMove(-rawY, rawX);
          } else {
            onMove(rawX, rawY);
          }
        });
        manager.on('end', onEnd);
        return manager;
      }

      const leftOutput = document.querySelector('#left-values');
      const rightOutput = document.querySelector('#right-values');

      setInterval(updateArmGesture, 50);

      requestAnimationFrame(() => {
        makeStick(
          document.querySelector('#left-stick'),
          (x, y) => {
            physicalSticks.left = { x, y };
            const shaped = shapePair(x, y);
            if (stickMode === 'jp') controlState.pitch = shaped.y;
            else controlState.throttle = (shaped.y + 1) / 2;
            controlState.yaw = shaped.x;
            leftOutput.value = `${stickMode === 'jp' ? 'P' : 'T'} ${shaped.y.toFixed(2)} · Y ${shaped.x.toFixed(2)}`;
            updateArmGesture();
            sendControls();
          },
          () => {
            physicalSticks.left = { x: 0, y: 0 };
            controlState[stickMode === 'jp' ? 'pitch' : 'throttle'] = stickMode === 'jp' ? 0 : .5;
            controlState.yaw = 0;
            leftOutput.value = `${stickMode === 'jp' ? 'P' : 'T'} 0.00 · Y 0.00`;
            sendControls(true);
          }
        );

        makeStick(
          document.querySelector('#right-stick'),
          (x, y) => {
            physicalSticks.right = { x, y };
            const shaped = shapePair(x, y);
            if (stickMode === 'jp') controlState.throttle = (shaped.y + 1) / 2;
            else controlState.pitch = shaped.y;
            controlState.roll = shaped.x;
            rightOutput.value = `${stickMode === 'jp' ? 'T' : 'P'} ${shaped.y.toFixed(2)} · R ${shaped.x.toFixed(2)}`;
            updateArmGesture();
            sendControls();
          },
          () => {
            physicalSticks.right = { x: 0, y: 0 };
            controlState[stickMode === 'jp' ? 'throttle' : 'pitch'] = stickMode === 'jp' ? .5 : 0;
            controlState.roll = 0;
            rightOutput.value = `${stickMode === 'jp' ? 'T' : 'P'} 0.00 · R 0.00`;
            sendControls(true);
          }
        );
      });

      modeButtons.us.addEventListener('click', () => setStickMode('us'));
      modeButtons.jp.addEventListener('click', () => setStickMode('jp'));
      bindRatePanel(document.querySelector('#rate-panel'), rateConfig, values => {
        if (connection?.open) connection.send({ type: 'config', values });
      });
      rateConfig.addEventListener('change', event => {
        const requestedMode = event.detail.stickMode === 'mode1' ? 'jp' : 'us';
        if (requestedMode !== stickMode) setStickMode(requestedMode);
      });
      setStickMode(stickMode);

      document.querySelectorAll('[data-command]').forEach(button => {
        button.addEventListener('click', () => sendCommand(button.dataset.command));
      });
      document.querySelector('#arm-button').addEventListener('click', () => sendCommand('arm'));

      if (!peerId) {
        document.querySelector('#missing-peer').classList.add('visible');
        setStatus('缺少 Peer ID', 'error');
        return;
      }

      const peer = new Peer();
      peer.on('open', () => {
        setStatus('正在連線…');
        connection = peer.connect(peerId, { reliable: false, serialization: 'json' });
        connection.on('open', () => {
          setStatus('已連線', 'connected');
          connection.send({ type: 'config', values: rateConfig.toJSON() });
          sendControls(true);
        });
        connection.on('data', data => {
          if (data?.type === 'config') {
            rateConfig.set(data.values || {});
            return;
          }
          if (data?.type !== 'telemetry') return;
          document.querySelector('#altitude').textContent = `${Number(data.altitude).toFixed(1)}m`;
          document.querySelector('#speed').textContent = `${Number(data.speed).toFixed(1)}m/s`;
          document.querySelector('#heading').textContent = `${Math.round(Number(data.heading))}°`;
          document.querySelector('#battery').textContent = `${Math.round(Number(data.battery))}%`;
          const armButton = document.querySelector('#arm-button');
          remoteArmed = Boolean(data.armed);
          if (!gestureStartedAt) armButton.textContent = data.armed ? '鎖定馬達' : '解鎖馬達';
          if (data.crashEvent && data.crashEvent !== lastCrashEvent) {
            lastCrashEvent = data.crashEvent;
            showFeedback(`⚠ 墜機：${data.crashReason || '發生碰撞'}`);
            vibrate(HAPTICS.crash);
          }
          const assessment = data.assessment;
          if (assessment) {
            if (assessment.time < .5 && assessment.waypoint === 1 && lastWaypoint === 99) {
              lastWaypoint = 1;
              lastScoreBand = 100;
            }
            if (assessment.waypoint > lastWaypoint) {
              lastWaypoint = assessment.waypoint;
              vibrate(HAPTICS.waypoint);
              showFeedback(`通過 P${assessment.waypoint - 1}`);
            }
            const scoreBand = Math.floor(Number(assessment.score) / 5) * 5;
            if (scoreBand < lastScoreBand && assessment.time > 0) vibrate(HAPTICS.penalty);
            lastScoreBand = scoreBand;
            if (assessment.completed && lastWaypoint !== 99) {
              lastWaypoint = 99;
              vibrate(HAPTICS.complete);
              showFeedback(`${assessment.passed ? '考核合格' : '考核未通過'} · ${Number(assessment.score).toFixed(1)} 分`);
            }
          }
        });
        connection.on('close', () => setStatus('連線已中斷', 'error'));
        connection.on('error', () => setStatus('連線錯誤', 'error'));
      });
      peer.on('error', error => {
        console.error(error);
        setStatus(`連線失敗：${error.type || 'unknown'}`, 'error');
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          Object.assign(controlState, { throttle: .5, yaw: 0, pitch: 0, roll: 0 });
          sendControls(true);
        }
      });
      // iOS gesture events and rapid double taps can bypass the viewport flag.
      document.addEventListener('gesturestart', event => event.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', event => event.preventDefault(), { passive: false });
      document.addEventListener('gestureend', event => event.preventDefault(), { passive: false });
      document.addEventListener('dblclick', event => event.preventDefault(), { passive: false });
    })();
  </script>
</body>
</html>
